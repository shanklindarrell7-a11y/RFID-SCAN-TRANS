name: Build and Test RFID Sniffer App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up FlipperZero SDK
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build Application
        run: |
          make

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: rfid_sniffer_build
          path: build/
