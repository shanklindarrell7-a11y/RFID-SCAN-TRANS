name: Build and Test RFID Sniffer App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc libsqlite3-dev

      - name: Build Application
        run: |
          make all

      - name: Run Tests
        run: |
          make test

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfid_sniffer_build
          path: |
            librfid_sniffer.a
            rfid_example